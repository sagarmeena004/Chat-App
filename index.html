<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Live Chat (Cross-Tab)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(145deg, #1e2a3a 0%, #0f1724 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-card {
      width: 550px;
      max-width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 32px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      backdrop-filter: blur(2px);
      transition: all 0.2s;
    }

    .chat-header {
      background: #075e54;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .chat-header span {
      font-size: 1.8rem;
    }

    .tab-info {
      background: #e6f7ff;
      color: #0066cc;
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
      border-bottom: 1px solid #cce5ff;
      font-weight: 500;
    }

    .messages-area {
      height: 400px;
      overflow-y: auto;
      padding: 18px 16px;
      background: url(dark-theme-background-q62o6998n8bqxzrf.jpg.jpeg);
      background-position: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 22px;
      font-size: 0.95rem;
      word-wrap: break-word;
      line-height: 1.4;
      box-shadow: 0 1px 1px rgba(0,0,0,0.05);
      animation: fadeIn 0.2s ease;
    }

    .message.self {
      background: #dcf8c5;
      align-self: flex-end;
      border-bottom-right-radius: 6px;
    }

    .message.other {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 6px;
    }

    .message-meta {
      font-size: 0.7rem;
      color: #6c757d;
      margin-top: 5px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .input-container {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 40px;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }

    #messageInput:focus {
      border-color: #075e54;
      box-shadow: 0 0 0 2px rgba(7,94,84,0.2);
    }

    button {
      background: #075e54;
      border: none;
      color: white;
      padding: 0 24px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #0b6e62;
      transform: scale(1.02);
    }

    .status {
      text-align: center;
      font-size: 0.75rem;
      padding: 8px;
      background: #fef9e6;
      color: #9e6d0b;
      border-top: 1px solid #ffecb3;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px);}
      to { opacity: 1; transform: translateY(0);}
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #ddd;
    }
    ::-webkit-scrollbar-thumb {
      background: #075e54;
      border-radius: 6px;
    }
  </style>
</head>
<body>
<div class="chat-card">
  <div class="chat-header">
    <span>💬</span> Live Chat Applicaton
  </div>
  <div class="tab-info" id="tabInfo">
    🔄 Connecting to other tabs...
  </div>
  <div class="messages-area" id="messagesContainer">
    <div style="text-align: center; color: #777; padding: 20px;">✨ Open this page in another tab to start chatting.</div>
  </div>
  <div class="input-container">
    <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
  <div class="status" id="statusDisplay">
    🟢 Active
  </div>
</div>

<script>
  (function(){
    // ---------- UNIQUE TAB ID ----------
    const tabId = 'tab_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    let username = 'You';  // You can modify later

    // DOM elements
    const messagesDiv = document.getElementById('messagesContainer');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const tabInfo = document.getElementById('tabInfo');

    // ---------- BROADCAST CHANNEL ----------
    const channel = new BroadcastChannel('live_chat_frontend');

    // Notify other tabs that a new tab has joined (optional)
    channel.postMessage({
      type: 'USER_JOINED',
      tabId: tabId,
      time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    });

    // Update tab info with total active tabs (we'll track via heartbeat)
    let activeTabs = new Set();  // store tabIds that recently sent heartbeat

    // Heartbeat: every 10 sec send 'PING' to know which tabs are alive
    function sendHeartbeat() {
      channel.postMessage({
        type: 'HEARTBEAT',
        tabId: tabId,
        time: Date.now()
      });
    }
    setInterval(sendHeartbeat, 10000);
    sendHeartbeat();

    // Remove inactive tabs after 12 sec without heartbeat
    setInterval(() => {
      const now = Date.now();
      // We'll maintain a Map for last heartbeat time (simplify: use Set with timeout reset)
      // For simplicity we rely on 'USER_LEFT' but also can clean. I'll keep activeTabs via explicit leave.
    }, 15000);

    // Listen for messages from other tabs
    channel.onmessage = (event) => {
      const data = event.data;
      if (!data) return;

      switch(data.type) {
        case 'NEW_MESSAGE':
          // received message from another tab
          addMessageToUI(data.text, data.senderId === tabId ? 'self' : 'other', data.senderLabel, data.time);
          break;
        case 'USER_JOINED':
          if (data.tabId !== tabId) {
            addSystemMessage(`👤 New tab joined (${data.tabId.slice(-6)})`);
            activeTabs.add(data.tabId);
            updateTabInfoCount();
          }
          break;
        case 'USER_LEFT':
          activeTabs.delete(data.tabId);
          updateTabInfoCount();
          addSystemMessage(`🚪 A tab left the chat`);
          break;
        case 'HEARTBEAT':
          if (data.tabId !== tabId) {
            activeTabs.add(data.tabId);
            updateTabInfoCount();
          }
          break;
        default: break;
      }
    };

    // When tab closes, notify others
    window.addEventListener('beforeunload', () => {
      channel.postMessage({
        type: 'USER_LEFT',
        tabId: tabId
      });
    });

    function updateTabInfoCount() {
      const count = activeTabs.size;
      if (count === 0) {
        tabInfo.innerHTML = '💤 No other tabs open. Open this page in a new tab to chat!';
      } else {
        tabInfo.innerHTML = `🌐 ${count} active tab${count > 1 ? 's' : ''} connected — realtime sync active`;
      }
    }

    function addSystemMessage(text) {
      const sysDiv = document.createElement('div');
      sysDiv.style.textAlign = 'center';
      sysDiv.style.fontSize = '0.7rem';
      sysDiv.style.color = '#6c757d';
      sysDiv.style.margin = '6px 0';
      sysDiv.style.backgroundColor = '#f0f0f0';
      sysDiv.style.padding = '4px 8px';
      sysDiv.style.borderRadius = '30px';
      sysDiv.style.width = 'fit-content';
      sysDiv.style.marginInline = 'auto';
      sysDiv.innerText = text;
      messagesDiv.appendChild(sysDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addMessageToUI(text, type, senderLabel, timeStr) {
      // Remove placeholder if exists
      if (messagesDiv.children.length === 1 && messagesDiv.children[0].innerText.includes('Open this page in another tab')) {
        messagesDiv.innerHTML = '';
      }
      const msgWrapper = document.createElement('div');
      msgWrapper.className = `message ${type === 'self' ? 'self' : 'other'}`;
      
      const textSpan = document.createElement('div');
      textSpan.innerText = text;
      
      const metaSpan = document.createElement('div');
      metaSpan.className = 'message-meta';
      if (type === 'other') {
        metaSpan.innerHTML = `<span>${senderLabel || 'Other'}</span> • ${timeStr}`;
      } else {
        metaSpan.innerHTML = `<span>You</span> • ${timeStr}`;
      }
      
      msgWrapper.appendChild(textSpan);
      msgWrapper.appendChild(metaSpan);
      messagesDiv.appendChild(msgWrapper);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Send message from current tab
    function sendMessage() {
      const text = input.value.trim();
      if (text === "") return;
      
      const now = new Date();
      const timeString = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      
      // Show in own UI immediately
      addMessageToUI(text, 'self', 'You', timeString);
      
      // Broadcast to all other tabs
      channel.postMessage({
        type: 'NEW_MESSAGE',
        text: text,
        senderId: tabId,
        senderLabel: 'Someone',  // optional
        time: timeString
      });
      
      input.value = '';
      input.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Initial active tabs count simulator (send a joined message after 500ms)
    setTimeout(() => {
      channel.postMessage({
        type: 'USER_JOINED',
        tabId: tabId,
        time: new Date().toLocaleTimeString()
      });
    }, 500);
    
    updateTabInfoCount();
  })();
</script>
</body>
</html>
